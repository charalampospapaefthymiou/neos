<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Termin buchen</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#f5f8fd;--bg2:#ffffff;--border:rgba(17,24,39,0.10);--border2:rgba(17,24,39,0.16);--text:#14192a;--text2:#5b6678;--accent:#3b6cf6;--accent2:#4f7cff;--success:#10b981;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Plus Jakarta Sans',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;padding:20px 14px 60px;}
body.embed{background:transparent;padding:6px 4px 20px;}
body.embed .powered{margin-top:16px;}
.wrap{width:100%;max-width:440px;}
.steps{display:flex;justify-content:center;gap:6px;margin:6px 0 18px;}
.steps .dot{width:26px;height:4px;border-radius:99px;background:var(--border2);transition:background .2s;}
.steps .dot.done{background:var(--accent);}
.steps .dot.active{background:var(--accent2);}
input.invalid{border-color:#f87171 !important;}
.logo{display:flex;align-items:center;gap:10px;justify-content:center;margin:18px 0 6px;}
.logo .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#4f7cff,#38bdf8);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff;flex-shrink:0;}
.logo .word{font-family:'Sora','Space Grotesk',sans-serif;font-size:20px;font-weight:700;letter-spacing:-0.03em;background:linear-gradient(135deg,#4f7cff,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.salon-name{text-align:center;font-size:22px;font-weight:800;margin-bottom:4px;}
.sub{text-align:center;font-size:13px;color:var(--text2);margin-bottom:24px;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;}
.step-title{font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;}
.opt{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border:1px solid var(--border2);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s;}
.opt:hover,.opt.sel{border-color:var(--accent);background:rgba(79,124,255,0.08);}
.opt .nm{font-weight:600;font-size:15px;}
.opt .meta{font-size:12px;color:var(--text2);}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;}
.chip{flex:0 0 auto;text-align:center;padding:10px 12px;border:1px solid var(--border2);border-radius:12px;cursor:pointer;min-width:62px;}
.chip.sel{border-color:var(--accent);background:rgba(79,124,255,0.1);}
.chip .d1{font-size:11px;color:var(--text2);}
.chip .d2{font-weight:700;font-size:15px;}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.slot{text-align:center;padding:11px 0;border:1px solid var(--border2);border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;}
.slot.sel{border-color:var(--accent);background:rgba(79,124,255,0.12);}
input{width:100%;background:rgba(0,0,0,0.04);border:1px solid var(--border2);border-radius:11px;padding:13px 14px;color:var(--text);font-size:15px;font-family:inherit;margin-bottom:10px;}
input:focus{outline:none;border-color:var(--accent);}
.btn{width:100%;background:linear-gradient(135deg,#4f7cff,#3258d8);color:#fff;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn:disabled{opacity:.5;cursor:default;}
.note{font-size:12px;color:var(--text2);text-align:center;margin-top:10px;line-height:1.5;}
.done{text-align:center;padding:40px 10px;}
.done .big{font-size:52px;margin-bottom:14px;}
.done h2{margin-bottom:10px;}
.done p{color:var(--text2);font-size:14px;line-height:1.6;}
.hidden{display:none !important;}
.err{color:#f87171;font-size:13px;text-align:center;margin-top:10px;}
.powered{text-align:center;margin-top:26px;font-size:12px;color:var(--text2);}
.powered b{background:linear-gradient(135deg,#7aa0ff,#b89bff);-webkit-background-clip:text;background-clip:text;color:transparent;}
.loading{text-align:center;color:var(--text2);padding:30px;}
</style>
</head>
<body>
<div class="wrap">
  <img id="studioLogo" class="hidden" style="width:56px;height:56px;border-radius:14px;object-fit:cover;display:block;margin:6px auto 10px;" />
  <div class="salon-name" id="salonName">&nbsp;</div>
  <div class="sub" id="salonSub">Online-Termin</div>
  <div class="sub hidden" id="salonDesc" style="margin-top:-16px;"></div>
  <div class="sub hidden" id="salonAddress" style="margin-top:-16px;font-size:12px;"></div>

  <div id="loading" class="loading">Lade…</div>
  <div id="unavailable" class="done hidden"><div class="big">📞</div><h2>Online-Buchung nicht aktiv</h2><p>Bitte kontaktiere den Salon direkt für einen Termin.</p></div>

  <div id="flow" class="hidden">
    <div class="steps" id="stepsBar">
      <div class="dot active" id="dotT"></div><div class="dot" id="dotD"></div><div class="dot" id="dotS"></div><div class="dot" id="dotK"></div>
    </div>
    <div class="card"><div class="step-title">1 · Behandlung</div><div id="treatList"></div></div>
    <div class="card hidden" id="stepDay"><div class="step-title">2 · Tag</div><div class="chips" id="dayChips"></div></div>
    <div class="card hidden" id="stepSlot"><div class="step-title">3 · Uhrzeit</div><div class="slots" id="slotGrid"></div><div class="note hidden" id="noSlots">An diesem Tag sind keine Termine frei — wähle einen anderen Tag.</div></div>
    <div class="card hidden" id="stepData">
      <div class="step-title">4 · Deine Daten</div>
      <input type="text" id="bkName" placeholder="Dein Name" autocomplete="name" />
      <input type="tel" id="bkPhone" placeholder="Handynummer (für die Bestätigung)" autocomplete="tel" />
      <input type="email" id="bkEmail" placeholder="E-Mail-Adresse" autocomplete="email" />
      <label style="display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.45;color:var(--text2);margin:4px 2px 10px;cursor:pointer;">
        <input type="checkbox" id="bkOptIn" style="margin-top:2px;flex-shrink:0;width:auto;" />
        <span>Ich möchte Terminerinnerungen und gelegentliche Nachrichten per WhatsApp erhalten. Jederzeit widerrufbar.</span>
      </label>
      <button class="btn" id="bkSubmit" onclick="submitBooking()">Termin anfragen</button>
      <div class="err hidden" id="bkErr"></div>
      <div class="note" id="modeNote"></div>
    </div>
  </div>

  <div id="done" class="done hidden">
    <div class="big" id="doneIcon">✨</div>
    <h2 id="doneTitle"></h2>
    <p id="doneText"></p>
  </div>

  <div class="powered">bereitgestellt mit <b>neos</b></div>
</div>

<script>
const slug=location.pathname.split('/').filter(Boolean).pop();
let salon=null,treatments=[],selT=null,selDate=null,selTime=null;

const $=id=>document.getElementById(id);
const fmtPrice=p=>p?Number(p).toLocaleString('de-DE',{minimumFractionDigits:0})+' €':'';

function applyBrandColor(color){
  if(!color)return;
  const s=document.createElement('style');
  s.textContent=`.btn{background:${color} !important;}
.opt:hover,.opt.sel,.chip.sel,.slot.sel{border-color:${color} !important;background:${color}1a !important;}
input:focus{border-color:${color} !important;}`;
  document.head.appendChild(s);
}

function updateSteps(step){
  const ids=['dotT','dotD','dotS','dotK'];
  ids.forEach((id,i)=>{
    const el=$(id);el.classList.remove('active','done');
    if(i<step)el.classList.add('done');else if(i===step)el.classList.add('active');
  });
}

async function init(){
  if(new URLSearchParams(location.search).get('embed')==='1')document.body.classList.add('embed');
  try{
    const res=await fetch('/api/booking?slug='+encodeURIComponent(slug));
    if(!res.ok)throw 0;
    const json=await res.json();
    salon=json.salon;treatments=json.treatments;
    $('salonName').textContent=salon.name;
    if(salon.logoUrl){$('studioLogo').src=salon.logoUrl;$('studioLogo').classList.remove('hidden');}
    if(salon.description){$('salonDesc').textContent=salon.description;$('salonDesc').classList.remove('hidden');}
    if(salon.address){$('salonAddress').textContent='📍 '+salon.address;$('salonAddress').classList.remove('hidden');}
    applyBrandColor(salon.brandColor);
    $('loading').classList.add('hidden');
    if(!treatments.length){$('unavailable').classList.remove('hidden');return;}
    $('flow').classList.remove('hidden');
    $('treatList').innerHTML=treatments.map(t=>`<div class="opt" onclick="pickT('${t.id}',this)"><div><div class="nm">${t.name}${t.is_online?' <span style="font-size:11px;font-weight:600;color:var(--accent2);background:rgba(79,124,255,0.12);padding:2px 7px;border-radius:6px;margin-left:4px;">🎥 Online</span>':''}</div><div class="meta">${t.duration_min||60} Min.${t.is_online?' · per Video':''}</div></div><div class="nm">${fmtPrice(t.price)}</div></div>`).join('');
    $('modeNote').textContent=salon.mode==='direct'?'Dein Termin ist nach dem Absenden fest gebucht.':'Der Salon bestätigt deine Anfrage schnellstmöglich — du gehst keine Verpflichtung ein.';
    $('bkSubmit').textContent=salon.mode==='direct'?'Verbindlich buchen':'Termin anfragen';
    renderDays();
  }catch(e){
    $('loading').classList.add('hidden');
    $('unavailable').classList.remove('hidden');
  }
}

function renderDays(){
  const days=[];const now=new Date();
  const names=['So','Mo','Di','Mi','Do','Fr','Sa'];
  for(let i=0;i<14;i++){
    const d=new Date(now.getTime()+i*86400000);
    const iso=d.toISOString().slice(0,10);
    const wd=String(d.getUTCDay());
    if(!(salon.hours&&salon.hours[wd]))continue;
    days.push({iso,label1:i===0?'Heute':names[d.getDay()],label2:d.getDate()+'.'+(d.getMonth()+1)+'.'});
  }
  $('dayChips').innerHTML=days.map(d=>`<div class="chip" onclick="pickD('${d.iso}',this)"><div class="d1">${d.label1}</div><div class="d2">${d.label2}</div></div>`).join('')||'<div class="note">Aktuell keine buchbaren Tage.</div>';
}

function pickT(id,el){
  selT=id;selDate=null;selTime=null;
  document.querySelectorAll('#treatList .opt').forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel');
  $('stepDay').classList.remove('hidden');
  $('stepSlot').classList.add('hidden');$('stepData').classList.add('hidden');
  document.querySelectorAll('#dayChips .chip').forEach(c=>c.classList.remove('sel'));
  updateSteps(1);
  setTimeout(()=>$('stepDay').scrollIntoView({behavior:'smooth',block:'start'}),80);
}

async function pickD(iso,el){
  selDate=iso;selTime=null;
  document.querySelectorAll('#dayChips .chip').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel');
  $('stepSlot').classList.remove('hidden');$('stepData').classList.add('hidden');
  $('slotGrid').innerHTML='<div class="note">Lade freie Termine…</div>';$('noSlots').classList.add('hidden');
  updateSteps(2);
  setTimeout(()=>$('stepSlot').scrollIntoView({behavior:'smooth',block:'start'}),80);
  const res=await fetch(`/api/booking?slug=${encodeURIComponent(slug)}&date=${iso}&treatment=${selT}`);
  const json=await res.json();
  if(!json.slots||!json.slots.length){$('slotGrid').innerHTML='';$('noSlots').classList.remove('hidden');return;}
  $('slotGrid').innerHTML=json.slots.map(s=>`<div class="slot" onclick="pickS('${s}',this)">${s}</div>`).join('');
}

function pickS(t,el){
  selTime=t;
  document.querySelectorAll('.slot').forEach(s=>s.classList.remove('sel'));
  el.classList.add('sel');
  $('stepData').classList.remove('hidden');
  updateSteps(3);
  setTimeout(()=>$('stepData').scrollIntoView({behavior:'smooth',block:'start'}),80);
}

async function submitBooking(){
  const name=$('bkName').value.trim(),phone=$('bkPhone').value.trim(),email=$('bkEmail').value.trim();
  const err=$('bkErr');err.classList.add('hidden');
  [$('bkName'),$('bkPhone'),$('bkEmail')].forEach(i=>i.classList.remove('invalid'));
  const emailOk=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  let bad=[];
  if(!name)bad.push($('bkName'));
  if(phone.replace(/[^0-9]/g,'').length<6)bad.push($('bkPhone'));
  if(!emailOk)bad.push($('bkEmail'));
  if(bad.length){
    bad.forEach(i=>i.classList.add('invalid'));
    err.textContent='Bitte Name, Handynummer und eine gültige E-Mail-Adresse angeben.';err.classList.remove('hidden');
    bad[0].focus();
    return;
  }
  const btn=$('bkSubmit');btn.disabled=true;btn.textContent='Einen Moment…';
  try{
    const res=await fetch('/api/booking',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({slug,treatment_id:selT,date:selDate,time:selTime,name,phone,email,opt_in:$('bkOptIn').checked})});
    const json=await res.json();
    if(!res.ok)throw new Error(json.error||'Fehler');
    const tName=treatments.find(t=>t.id===selT)?.name||'';
    $('flow').classList.add('hidden');
    $('done').classList.remove('hidden');
    const when=`${selDate.split('-').reverse().join('.')} um ${selTime} Uhr`;
    if(json.status==='booked'){
      $('doneIcon').textContent=json.is_online?'🎥':'🎉';
      $('doneTitle').textContent='Termin gebucht!';
      $('doneText').textContent=`${tName} am ${when}. Wir freuen uns auf dich!`;
    }else{
      $('doneIcon').textContent='💌';
      $('doneTitle').textContent='Anfrage gesendet!';
      $('doneText').textContent=`${tName} am ${when}. Der Salon bestätigt dir den Termin schnellstmöglich.`;
    }
    if(json.meeting_url){
      const safe=String(json.meeting_url).replace(/"/g,'&quot;');
      $('doneText').insertAdjacentHTML('afterend',
        `<div style="margin-top:18px;background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:16px;">
          <div style="font-size:13px;color:var(--text2);margin-bottom:10px;">Deine Online-Beratung findet per Video statt. Zum Termin einfach hier beitreten:</div>
          <a href="${safe}" target="_blank" rel="noopener" style="display:block;text-align:center;background:linear-gradient(135deg,#4f7cff,#3258d8);color:#fff;text-decoration:none;border-radius:11px;padding:13px;font-weight:700;">🎥 Video-Beratung beitreten</a>
          <div style="font-size:11px;color:var(--text2);margin-top:9px;word-break:break-all;">${safe}</div>
          <div style="font-size:11px;color:var(--text2);margin-top:6px;">Tipp: Speichere dir diesen Link — du brauchst ihn zum Termin.</div>
        </div>`);
    }
  }catch(e){
    err.textContent=e.message;err.classList.remove('hidden');
    btn.disabled=false;btn.textContent=salon.mode==='direct'?'Verbindlich buchen':'Termin anfragen';
  }
}
init();
</script>
</body></html>
